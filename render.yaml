services:
  - type: web
    name: classflow-preview
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: classflow-preview-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://classflow-preview.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SAME_SITE
        value: none
      - key: SESSION_MAX_AGE_SECONDS
        value: "2592000"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: CORS_ORIGINS
        value: https://classflow-preview.onrender.com

databases:
  - name: classflow-preview-db
    databaseName: classflow
    user: classflow
    plan: free
    region: singapore
